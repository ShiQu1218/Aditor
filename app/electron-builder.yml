appId: com.aditor.app
productName: Aditor
directories:
  output: ../dist
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../build/engine/aditor
    to: engine/aditor
  - from: ../build/ffmpeg
    to: ffmpeg
  - from: ../build/obs-hook
    to: obs-hook
  - from: resources
    to: resources
    filter:
      - tray-*.png
      - icon.png
  - from: ../templates
    to: templates
  - from: ../LICENSE
    to: LICENSE
  - from: ../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
# 自動更新來源：每次 Release 必須上傳安裝檔、.blockmap 與 latest.yml（build.ps1 只產生、不上傳）
publish:
  provider: github
  owner: ShiQu1218
  repo: Aditor
# 檔名不能有空格：GitHub 會把上傳檔名的空格換成「.」，跟 latest.yml 對不上
portable:
  artifactName: ${productName}-${version}-Portable.${ext}
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
