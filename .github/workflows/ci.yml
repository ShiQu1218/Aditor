name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-fast:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            recorder

      - uses: actions/cache@v4
        with:
          path: build/ffmpeg-lgpl-shared-*.zip
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        shell: pwsh
        run: ./scripts/fetch-ffmpeg.ps1

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Test Python tools
        run: |
          python -m pip install -r tools/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest tools/tests -q

      - name: Check Rust engine
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: 4
        run: |
          cargo fmt --manifest-path engine/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/build.ps1 -EngineOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content $env:GITHUB_PATH "$pwd/build/ffmpeg/bin"

      # Same fast tier developers run before committing.
      - name: Fast test tier
        shell: pwsh
        run: ./scripts/test.ps1 -Tier fast -KeepGoing
