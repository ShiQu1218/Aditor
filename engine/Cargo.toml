[package]
name = "aditor"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
rustfft = "6.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Pixel loops in cv/ are ~15x slower unoptimized, which breaks wall-clock-based tests (progress throttling).
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_IO", "Win32_System_JobObjects", "Win32_Security"] }
