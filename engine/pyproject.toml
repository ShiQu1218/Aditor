[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aditor"
version = "0.3.0"
description = "Aditor analysis engine"
requires-python = ">=3.11"
# Lower bounds match versions verified in the release build environment; upper bounds prevent breaking major upgrades.
dependencies = ["opencv-python>=5.0,<6", "numpy>=2.5,<3"]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout"]
tools = ["ccl_chromium_reader"]

[tool.setuptools.packages.find]
include = ["aditor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = ["slow: long-running tests against real recordings; excluded from the fast test tier"]
